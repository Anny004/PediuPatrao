<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a href="/clientes/novo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <!-- Tabela de clientes -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Endereço</th>
                    <th class="text-center pe-4" style="width: 200px;">Ações</th>
                </tr>
                </thead>
                <tbody id="clientes-tabela">
                <!-- Linhas carregadas via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Validação infalível: Verifica a autoridade exata -->
    <div id="permissao-excluir" style="display: none;" sec:authorize="hasAnyAuthority('ROLE_GERENTE')"></div>

    <script>
        const API_URL = '/api/clientes';
        const tabelaClientes = document.getElementById('clientes-tabela');

        // Checa se a div secreta de permissão existe na tela
        const divPermissao = document.getElementById('permissao-excluir');
        const podeExcluir = (divPermissao !== null);

        function formatarEndereco(cliente) {
            const partes = [
                cliente.logradouro,
                cliente.numero,
                cliente.complemento,
                cliente.bairro,
                cliente.cidade,
                cliente.estado
            ].filter(p => p && p.trim() !== '');

            return partes.length > 0 ? partes.join(', ') : (cliente.endereco || '—');
        }

        async function carregarClientes() {
            try {
                const response = await fetch(API_URL);
                const clientes = await response.json();
                tabelaClientes.innerHTML = '';

                if (clientes.length === 0) {
                    tabelaClientes.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                Nenhum cliente cadastrado.
                            </td>
                        </tr>`;
                    return;
                }

                clientes.forEach(cliente => {
                    const row = document.createElement('tr');

                    // Botão de Editar sempre aparece
                    let botoesAcao = `
                        <a href="/clientes/editar/${cliente.id}" class="btn btn-sm btn-outline-warning">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </a>
                    `;

                    // Se tiver a permissão (Admin ou Gerente), adiciona o Excluir do lado
                    if (podeExcluir) {
                        botoesAcao += `
                            <button class="btn btn-sm btn-outline-danger ms-2" onclick="excluirCliente('${cliente.id}')">
                                <i class="bi bi-trash-fill"></i> Excluir
                            </button>
                        `;
                    }

                    row.innerHTML = `
                        <td>${cliente.nome || '—'}</td>
                        <td>${cliente.telefone || '—'}</td>
                        <td>${formatarEndereco(cliente)}</td>
                        <td class="text-center pe-4">
                            <div class="d-flex justify-content-center">
                                ${botoesAcao}
                            </div>
                        </td>
                    `;
                    tabelaClientes.appendChild(row);
                });
            } catch (error) {
                console.error("Erro ao carregar clientes:", error);
            }
        }

        async function excluirCliente(id) {
            if (confirm('Tem certeza que deseja excluir este cliente?')) {
                try {
                    const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        alert('Cliente excluído com sucesso!');
                        carregarClientes(); // Recarrega a tabela na mesma hora
                    } else {
                        alert('Erro ao excluir o cliente. Ele pode estar vinculado a um pedido.');
                    }
                } catch (error) {
                    alert('Erro de comunicação com o servidor.');
                }
            }
        }

        carregarClientes();
    </script>
</div>
</body>
</html>

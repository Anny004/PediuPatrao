<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<body>

<div th:fragment="content" class="container-fluid py-2">

    <!-- Mensagens de Alerta -->
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>👤 Gestão de Clientes</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovoCliente">
            <i class="bi bi-person-plus-fill me-1"></i> Novo Cliente
        </button>
    </div>

    <!-- Tabela de Clientes -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço / Logradouro</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${clientes}">
                        <td th:text="${c.id}">ID</td>
                        <td class="fw-bold" th:text="${c.nome}">Nome</td>
                        <td th:text="${c.telefone}">(00) 00000-0000</td>
                        <td th:text="${c.logradouro}">Rua Exemplo, 123</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-warning me-1"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#modalEditarCliente' + ${c.id}">
                                <i class="bi bi-pencil"></i> Editar
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="5" class="text-center text-muted py-4">Nenhum cliente cadastrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modais de Edição para cada Cliente (Dispara a Auditoria RF05) -->
    <div th:each="c : ${clientes}">
        <div class="modal fade" th:id="'modalEditarCliente' + ${c.id}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/clientes/atualizar}" method="post">
                        <input type="hidden" name="id" th:value="${c.id}" />
                        <div class="modal-header bg-dark text-white">
                            <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Editar Cliente</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nome</label>
                                <input type="text" name="nome" th:value="${c.nome}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Telefone</label>
                                <input type="text" name="telefone" th:value="${c.telefone}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Endereço / Logradouro</label>
                                <input type="text" name="logradouro" th:value="${c.logradouro}" class="form-control" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-warning">Salvar Alterações</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Cadastrar Novo Cliente -->
    <div class="modal fade" id="modalNovoCliente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/clientes/salvar}" method="post">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>Novo Cliente</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nome</label>
                            <input type="text" name="nome" class="form-control" required placeholder="ex: Maria Silva">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Telefone</label>
                            <input type="text" name="telefone" class="form-control" required placeholder="(11) 99999-8888">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Endereço / Logradouro</label>
                            <input type="text" name="logradouro" class="form-control" required placeholder="ex: Av. Paulista, 1000">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<body>

<div th:fragment="content" class="container-fluid py-2">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📦 Gestão de Produtos</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovoProduto">
            <i class="bi bi-plus-circle-fill me-1"></i> Novo Produto
        </button>
    </div>

    <!-- Tabela de Produtos -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Preço (R$)</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${produtos}">
                        <td class="fw-bold" th:text="${p.nome}">Nome</td>
                        <!-- Atualizado para tipo -->
                        <td th:text="${p.tipo}">Tipo</td>
                        <td th:text="${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}">0,00</td>
                        <td class="text-center">

                            <button class="btn btn-sm btn-outline-warning me-1"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="|#modalEditarProduto${p.id}|">
                                <i class="bi bi-pencil"></i> Editar
                            </button>

                            <button class="btn btn-sm btn-outline-danger"
                                    th:data-id="${p.id}"
                                    onclick="excluirProdutoApi(this.getAttribute('data-id'))">
                                <i class="bi bi-trash"></i> Excluir
                            </button>

                        </td>
                    </tr>
                    <tr th:if="${produtos == null or #lists.isEmpty(produtos)}">
                        <td colspan="4" class="text-center text-muted py-4">Nenhum produto cadastrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modais de Edição para cada Produto -->
    <div th:each="p : ${produtos}">
        <div class="modal fade" th:id="|modalEditarProduto${p.id}|" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/produtos/atualizar}" method="post">
                        <input type="hidden" name="id" th:value="${p.id}" />
                        <div class="modal-header bg-dark text-white">
                            <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Editar Produto</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nome</label>
                                <input type="text" name="nome" th:value="${p.nome}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tipo</label>
                                <!-- Atualizado para name="tipo" -->
                                <select name="tipo" class="form-select" required>
                                    <option value="Pizza" th:selected="${p.tipo == 'Pizza'}">Pizza</option>
                                    <option value="Esfiha" th:selected="${p.tipo == 'Esfiha'}">Esfiha</option>
                                    <option value="Lanche" th:selected="${p.tipo == 'Lanche'}">Lanche</option>
                                    <option value="Bebida" th:selected="${p.tipo == 'Bebida'}">Bebida</option>
                                    <option value="Sobremesa" th:selected="${p.tipo == 'Sobremesa'}">Sobremesa</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Preço (Ex: 35.90)</label>
                                <input type="number" step="0.01" name="preco" th:value="${p.preco}" class="form-control" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-warning">Salvar Alterações</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Cadastrar Novo Produto -->
    <div class="modal fade" id="modalNovoProduto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/produtos/salvar}" method="post">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Novo Produto</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nome</label>
                            <input type="text" name="nome" class="form-control" required placeholder="Ex: Pizza Calabresa">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo</label>
                            <!-- Atualizado para name="tipo" -->
                            <select name="tipo" class="form-select" required>
                                <option value="">Selecione...</option>
                                <option value="Pizza">Pizza</option>
                                <option value="Esfiha">Esfiha</option>
                                <option value="Lanche">Lanche</option>
                                <option value="Bebida">Bebida</option>
                                <option value="Sobremesa">Sobremesa</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Preço (Ex: 35.90)</label>
                            <input type="number" step="0.01" name="preco" class="form-control" required placeholder="0.00">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        async function excluirProdutoApi(id) {
            if (confirm('Tem certeza que deseja excluir este produto?')) {
                try {
                    const csrfToken = document.querySelector('input[name="_csrf"]')?.value;
                    const headers = {};
                    if (csrfToken) headers['X-CSRF-TOKEN'] = csrfToken;

                    // O fetch bate com a anotação @RequestMapping("/produtos") e @DeleteMapping("/{id}")
                    const response = await fetch(`/produtos/${id}`, {
                        method: 'DELETE',
                        headers: headers
                    });

                    if (response.ok) {
                        alert('Produto excluído com sucesso!');
                        window.location.reload();
                    } else if (response.status === 403) {
                        alert('Acesso negado: Apenas o Gerente possui permissão para excluir produtos.');
                    } else {
                        alert('Erro ao excluir o produto.');
                    }
                } catch (error) {
                    alert('Erro de comunicação com o servidor.');
                }
            }
        }
    </script>
</div>

</body>
</html>

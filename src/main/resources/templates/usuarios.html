<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<body>

<div th:fragment="content" class="container-fluid py-2">

    <!-- Mensagens de Sucesso ou Erro -->
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>👥 Gerenciamento de Usuários</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovoUsuario">
            <i class="bi bi-person-plus-fill me-1"></i> Novo Usuário
        </button>
    </div>

    <!-- Tabela de Gerenciamento -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Usuário</th>
                        <th>Função (Role)</th>
                        <th class="text-center">Atribuir Novo Perfil</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}">ID</td>
                        <td class="fw-bold" th:text="${u.username}">admin</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.role?.name() == 'ADMIN' ? 'bg-danger' : (u.role?.name() == 'GERENTE' ? 'bg-warning text-dark' : 'bg-info text-dark')}"
                                  th:text="${u.role}">ADMIN</span>
                        </td>
                        <td class="text-center">
                            <form th:action="@{/usuarios/alterar-perfil}" method="post" class="d-inline-flex align-items-center gap-2">
                                <input type="hidden" name="id" th:value="${u.id}"/>
                                <select name="perfil" class="form-select form-select-sm" style="width: 130px;">
                                    <option value="ADMIN" th:selected="${u.role?.name() == 'ADMIN'}">ADMIN</option>
                                    <option value="GERENTE" th:selected="${u.role?.name() == 'GERENTE'}">GERENTE</option>
                                    <option value="ATENDENTE" th:selected="${u.role?.name() == 'ATENDENTE'}">ATENDENTE</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-outline-secondary" title="Salvar Perfil">
                                    <i class="bi bi-check-lg"></i> Salvar
                                </button>
                            </form>
                        </td>
                        <td class="text-center">
                            <form th:action="@{/usuarios/excluir/{id}(id=${u.id})}" method="post" onsubmit="return confirm('Deseja realmente excluir este usuário?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Excluir Usuário">
                                    <i class="bi bi-trash"></i> Excluir
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal para Cadastrar Novo Usuário -->
    <div class="modal fade" id="modalNovoUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/usuarios/salvar}" method="post">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>Cadastrar Usuário</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nome de Usuário (Login)</label>
                            <input type="text" name="username" class="form-control" required placeholder="ex: joao.silva">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Senha</label>
                            <input type="password" name="password" class="form-control" required placeholder="Digite a senha">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Perfil / Função</label>
                            <select name="role" class="form-select" required>
                                <option value="ATENDENTE">ATENDENTE</option>
                                <option value="GERENTE">GERENTE</option>
                                <option value="ADMIN">ADMIN</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

</body>
</html>

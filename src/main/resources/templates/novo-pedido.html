<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<body>

<div th:fragment="content" class="container-fluid py-4">

    <!-- Cabeçalho com botão Voltar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🛒 Novo Pedido</h2>
        <a href="/pedidos" class="btn btn-outline-secondary">← Voltar</a>
    </div>

    <!-- Mensagem de Alerta (Aviso / Erro) -->
    <div th:if="${erro}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Card do Formulário -->
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/pedidos/salvar}" th:object="${pedido}" method="post">

                <!-- Dados do Pedido (Cliente + Desconto) -->
                <div class="row g-3 mb-4">

                    <!-- Seleção do Cliente Cadastrado -->
                    <div class="col-md-6">
                        <label for="cliente" class="form-label fw-bold">Cliente:</label>
                        <select id="cliente" name="cliente" class="form-select" required>
                            <option value="" disabled selected>-- Selecione um cliente --</option>
                            <option th:each="c : ${clientes}"
                                    th:value="${c.nome}"
                                    th:text="${c.nome + ' - ' + c.telefone}">
                                Maria Silva
                            </option>
                        </select>
                    </div>

                    <!-- Campo de Desconto -->
                    <div class="col-md-6">
                        <label for="desconto" class="form-label fw-bold">Desconto (%) — Máx. 20%:</label>
                        <input type="number"
                               step="0.1"
                               min="0"
                               max="20"
                               id="desconto"
                               th:field="*{desconto}"
                               class="form-control"
                               placeholder="0.0"
                               th:readonly="${!isGerente}">

                        <small th:if="${!isGerente}" class="text-muted d-block mt-1">
                            🔒 Apenas o perfil <strong>GERENTE</strong> pode conceder descontos.
                        </small>
                        <small th:if="${isGerente}" class="text-muted d-block mt-1">
                            💡 O desconto é limitado a no máximo <strong>20%</strong>.
                        </small>
                    </div>
                </div>

                <hr class="my-4">

                <!-- Item do Pedido -->
                <h5 class="mb-3">📋 Item do Pedido</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="nomeProduto" class="form-label fw-bold">Nome do Produto / Pizza:</label>
                        <input type="text" id="nomeProduto" name="nomeProduto" class="form-control" placeholder="Ex: Pizza Calabresa" required>
                    </div>
                    <div class="col-md-3">
                        <label for="quantidade" class="form-label fw-bold">Quantidade:</label>
                        <input type="number" id="quantidade" name="quantidade" class="form-control" value="1" min="1" required>
                    </div>
                    <div class="col-md-3">
                        <label for="precoUnitario" class="form-label fw-bold">Preço Unitário (R$):</label>
                        <input type="number" step="0.01" id="precoUnitario" name="precoUnitario" class="form-control" placeholder="0.00" required>
                    </div>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-success px-4">✔ Salvar Pedido</button>
                </div>

            </form>
        </div>
    </div>

</div>

</body>
</html>
